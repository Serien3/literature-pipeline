[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-pipeline"
version = "0.1.0"
description = "Import Zotero metadata and link local PDFs into an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["obsidian", "research", "zotero"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.scripts]
literature-pipeline = "literature_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["literature_pipeline*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
